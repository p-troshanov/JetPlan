# nginx/nginx.conf
# Маршрутизирует API к FastAPI, а остальные запросы — к production frontend.
server {
    listen 80;
    server_name jetplan.site;

    # Проксируем запросы к бэкенду (FastAPI) по внутреннему имени сервиса Docker
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксируем остальные запросы к контейнеру со статическим frontend.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
